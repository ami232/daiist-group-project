<section class="trip-card" aria-labelledby="trip-title">
  <header class="trip-header">
    <div><h2 id="trip-title">Your shopping route</h2><p data-map-note>Tap a number on the map or choose a stop from your list.</p></div>
    <strong data-example hidden>Example route</strong>
  </header>
  <div class="trip-layout">
    <div class="trip-map">
      <div class="trip-board">
        <img src="${floor_plan}" alt="Top-down floor plan with dashed walkways, left and right shelf faces, entrance and checkout." width="800" height="500">
        <canvas class="trip-route" width="1600" height="1000" aria-hidden="true"></canvas>
        <div class="trip-pins" role="group" aria-label="Numbered map stops"></div>
      </div>
      <p class="trip-legend"><span>Next walking leg</span><span>Store walkways</span></p>
    </div>
    <div class="trip-list">
      <div class="trip-guide" aria-live="polite" hidden>
        <small data-instruction>Walk to</small><strong data-to></strong>
      </div>
      <p class="trip-empty">No route for this upload. Use the message above or reload the example.</p>
      <section class="trip-checklist" aria-label="Shopping checklist" hidden>
        <h3 class="trip-list-title">Shopping checklist</h3>
        <div class="trip-progress"><strong role="status" data-progress></strong><button type="button" data-reset hidden>Reset</button></div>
        <progress class="trip-meter" aria-label="Items picked up" value="0"></progress>
        <div class="trip-stop-list" aria-label="Pick-up stops"></div>
        <div class="trip-details" hidden>
          <h3 data-stop-title></h3>
          <div data-items></div>
          <button type="button" class="trip-next" data-next>Next stop</button>
        </div>
      </section>
    </div>
  </div>
</section>
