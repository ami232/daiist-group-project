# Tender Desk uses the workspace’s existing free Postgres with separate log tables.
# SETUP.md explains how to use an independent database in another workspace.
services:
  - type: web
    name: construction-tender-desk
    runtime: python
    plan: free
    region: frankfurt
    branch: codex/tender-tool
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-sync python app.py
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: daiist-group-project-logs
          property: connectionString
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
