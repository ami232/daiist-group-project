# Manual only, on purpose.
#
# This never runs by itself. You start it yourself from the Actions tab when
# you want a check, which also means it always runs in YOUR fork, where your
# own secrets are available. (GitHub withholds secrets from workflows
# triggered by a pull request from a fork, so an automatic PR check could
# never have worked here anyway.)
#
# Add each key your app needs as a secret on your fork (Settings > Secrets and
# variables > Actions) and list it under `env` below.
#
# It runs exactly the same thing as `uv run python check.py` on your laptop.
name: Verify group project

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run the submission self-check
        run: uv run python check.py
