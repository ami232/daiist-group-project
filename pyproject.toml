[project]
name = "daiist-group-project"
version = "0.1.0"
description = "DAIIST group assignment: an AI product with two connected components, deployed, logged and monitored"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=3.6.1",
    "gradio>=6.31,<7",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=12.3.0",
    "pillow-heif>=1.0,<2",
    "psycopg[binary]>=3.2",
]

# Only for running evaluate.ipynb locally; not installed on Render.
[dependency-groups]
dev = [
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
